<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Commerce Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black tracking-tight text-amber-400">AWS</span>
        <span class="text-xl font-semibold">Commerce</span>
      </div>

      <div class="flex items-center space-x-6">
        <div id="authStatus" class="text-sm">
          <button onclick="toggleAuthModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm transition">
            Login / Register
          </button>
        </div>

        <div class="relative cursor-pointer" onclick="openCart()">
          <span class="text-2xl">🛒</span>
          <span id="cartCount" class="absolute -top-2 -right-2 bg-amber-500 text-slate-900 text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900">Featured Catalog</h1>
      <p class="text-gray-500 mt-1">Live cloud products synced with Supabase PostgreSQL</p>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Dynamic Products Rendered Here -->
    </div>
  </main>

  <!-- Cart Drawer / Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h2 class="text-xl font-bold text-slate-900">Your Shopping Cart</h2>
          <button onclick="closeCart()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold">&times;</button>
        </div>
        <div id="cartItemsList" class="mt-4 space-y-4 max-h-[60vh] overflow-y-auto">
          <!-- Cart Items Here -->
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between items-center text-lg font-bold mb-4">
          <span>Total:</span>
          <span id="cartTotal" class="text-emerald-600">₹0.00</span>
        </div>
        <button onclick="executeCheckout()" id="checkoutBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow">
          Checkout Now
        </button>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-xl font-bold text-slate-900 mb-4">Customer Access</h3>
      <div class="space-y-3">
        <input id="authEmail" type="email" placeholder="Email address" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-amber-500" />
        <input id="authPassword" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-amber-500" />
        <div class="flex gap-2 pt-2">
          <button onclick="handleAuth('/api/v1/auth/login')" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2 rounded-lg text-sm transition">Sign In</button>
          <button onclick="handleAuth('/api/v1/auth/register')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold py-2 rounded-lg text-sm transition">Register</button>
        </div>
      </div>
      <button onclick="toggleAuthModal()" class="mt-4 text-xs text-gray-500 w-full text-center hover:underline">Close</button>
    </div>
  </div>

  <script>
    let currentUserId = localStorage.getItem("userId") || "1";
    let authToken = localStorage.getItem("token") || null;

    async function loadProducts() {
      try {
        const res = await fetch('/api/v1/products');
        const products = await res.json();
        const grid = document.getElementById('productGrid');
        grid.innerHTML = products.map(p => `
          <div class="bg-white border rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="h-40 bg-gray-100 rounded-xl mb-4 flex items-center justify-center text-4xl">📦</div>
              <h3 class="font-bold text-lg text-slate-900">${p.name}</h3>
              <p class="text-sm text-gray-500 mt-1">Available Stock: <span class="font-semibold text-slate-700">${p.stockQuantity}</span></p>
            </div>
            <div class="mt-4 pt-4 border-t flex justify-between items-center">
              <span class="text-xl font-extrabold text-slate-900">₹${p.price.toFixed(2)}</span>
              <button onclick="addToCart(${p.id})" class="bg-slate-900 hover:bg-amber-500 hover:text-slate-900 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
                Add to Cart
              </button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Failed to load products", e);
      }
    }

    async function addToCart(productId) {
      await fetch(`/api/v1/cart/${currentUserId}/add?productId=${productId}&quantity=1`, { method: 'POST' });
      updateCartBadge();
    }

    async function updateCartBadge() {
      try {
        const res = await fetch(`/api/v1/cart/${currentUserId}`);
        const cart = await res.json();
        const totalCount = (cart.items || []).reduce((acc, item) => acc + item.quantity, 0);
        document.getElementById('cartCount').innerText = totalCount;
      } catch (e) {}
    }

    async function openCart() {
      document.getElementById('cartModal').classList.remove('hidden');
      const res = await fetch(`/api/v1/cart/${currentUserId}`);
      const cart = await res.json();
      const list = document.getElementById('cartItemsList');

      if (!cart.items || cart.items.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-center py-8">Your cart is empty.</p>';
      } else {
        list.innerHTML = cart.items.map(item => `
          <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
            <div>
              <h4 class="font-semibold text-sm">${item.product.name}</h4>
              <span class="text-xs text-gray-500">Qty: ${item.quantity}</span>
            </div>
            <span class="font-bold text-sm">₹${(item.product.price * item.quantity).toFixed(2)}</span>
          </div>
        `).join('');
      }

      const totalRes = await fetch(`/api/v1/cart/${currentUserId}/total`);
      const totalData = await totalRes.json();
      document.getElementById('cartTotal').innerText = `₹${(totalData.totalAmount || 0).toFixed(2)}`;
    }

    function closeCart() {
      document.getElementById('cartModal').classList.add('hidden');
    }

    async function executeCheckout() {
      const res = await fetch(`/api/v1/cart/${currentUserId}/checkout`, { method: 'POST' });
      if (res.ok) {
        alert("Order placed successfully! Transaction synced to Supabase.");
        closeCart();
        loadProducts();
        updateCartBadge();
      } else {
        alert("Checkout failed. Out of stock!");
      }
    }

    function toggleAuthModal() {
      document.getElementById('authModal').classList.toggle('hidden');
    }

    async function handleAuth(url) {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem("userId", data.userId);
        localStorage.setItem("token", data.token);
        currentUserId = data.userId;
        document.getElementById('authStatus').innerHTML = `<span class="text-xs bg-slate-800 px-3 py-1.5 rounded-full font-mono text-amber-400">${email}</span>`;
        toggleAuthModal();
        updateCartBadge();
      } else {
        alert("Auth Error: " + (data.message || "Failed"));
      }
    }

    window.onload = () => {
      loadProducts();
      updateCartBadge();
    };
  </script>
</body>
</html>
